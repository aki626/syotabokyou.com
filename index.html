<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ショタボ教</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="title-text">ショタボ教</div>

    <nav>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>

      <div class="mode-switch">
        <button id="normalBtn" class="mode-btn active">普通</button>
        <button id="rainbowBtn" class="mode-btn">虹色</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>ショタボ教</h1>
      <p>Lineオープンチャット｜雑談・歌枠｜雑談も全然○｜管理人が結構歌います</p>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p>
        🌟 ショタボ教へようこそ。<br>
        ラインオープンチャット「歌枠・雑談　雑談も全然○管理人が結構歌います」のみーくん が作った宗教（？）です。<br>
        このオープンチャットは基本なんでもOK。<br>
        暴言✖・荒らし✖ だけ禁止です。<br>
        ぜひご参加お待ちしております！<br>
      </p>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p>ラインオープンチャットのURLです</p>

      <a href="https://openchat-review.me/oc/473699" class="url-btn" target="_blank">
        オープンチャットに参加する
      </a>
    </section>
  </main>

  <footer>
    © 2026 ショタボ教
  </footer>

  <script>
    const normalBtn = document.getElementById("normalBtn");
    const rainbowBtn = document.getElementById("rainbowBtn");

    normalBtn.onclick = () => {
      document.body.classList.remove("rainbow-mode");
      normalBtn.classList.add("active");
      rainbowBtn.classList.remove("active");
    };

    rainbowBtn.onclick = () => {
      document.body.classList.add("rainbow-mode");
      rainbowBtn.classList.add("active");
      normalBtn.classList.remove("active");
    };
  </script>

</body>
</html>
